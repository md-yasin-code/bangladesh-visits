<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14352a">
  <meta name="robots" content="noindex,follow">
  <title>Page not found | Discover Bangladesh</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light;--green:#14352a;--rust:#b5532f;--paper:#f7f4ed;--ink:#23342d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,7vw,64px);border:1px solid rgba(20,53,42,.13);border-radius:24px;background:#fff;box-shadow:0 24px 70px rgba(20,53,42,.08);text-align:center}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 24px;border-radius:17px;background:var(--green);color:#fff;font-size:25px}
    .code{margin:0;color:var(--rust);font-size:clamp(3.5rem,12vw,6rem);font-weight:750;letter-spacing:-.07em;line-height:1}
    h1{margin:18px 0 10px;color:var(--green);font-family:Georgia,serif;font-size:clamp(1.7rem,5vw,2.4rem);font-weight:500}
    p{margin:0 auto 28px;max-width:42ch;color:#617067}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--green);color:white;text-decoration:none;font-weight:650}
    a:hover{background:#20513f}
    a:focus-visible{outline:3px solid var(--rust);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">বাংলা</div>
    <p class="code">404</p>
    <h1>This page wandered off the map.</h1>
    <p>The page may have moved, or the address may be incorrect. Return to the travel guide and continue exploring Bangladesh.</p>
    <a href="./index.html#/">Back to Discover Bangladesh</a>
  </main>
</body>
</html>
